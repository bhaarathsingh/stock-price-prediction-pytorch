[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-price-prediction-pytorch"
version = "0.1.0"
description = "An LSTM forecasting lab with chronological evaluation and persistence baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
market = ["yfinance==0.2.66", "multitasking==0.0.12", "peewee>=3.16,<4"]
dashboard = ["streamlit>=1.40,<2"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
stock-lstm = "stock_lstm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
