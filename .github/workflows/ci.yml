name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install -c constraints-tested.txt torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -c constraints-tested.txt -e '.[dev,dashboard]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
